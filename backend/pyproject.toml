[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "docs/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2
include_namespace_packages = true
